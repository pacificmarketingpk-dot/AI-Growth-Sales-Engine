# Serves the built SPA and proxies /api to the FastAPI container on the same origin,
# so session cookies stay first-party and no CORS is needed in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;   # CSV uploads are capped at 5 MB by the API
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # /api responses carry the API's own (stricter) security headers.
    location /api/ {
        proxy_pass http://__BACKEND__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # AI analysis can take a while
    }

    # Hashed assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include __INC__;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include __INC__;
        try_files $uri /index.html;
    }
}
